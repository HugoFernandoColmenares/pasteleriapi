<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pastry bench — stock & bake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4ead7;
            --ink: #2a1810;
            --cocoa: #6b3a2a;
            --berry: #b4233a;
            --sage: #3f6b4a;
            --card: rgba(255, 250, 242, 0.86);
            --line: rgba(42, 24, 16, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Outfit, system-ui, sans-serif;
            background:
                radial-gradient(circle at 12% 10%, #fff6e8 0 18%, transparent 42%),
                radial-gradient(circle at 90% 0%, #ead7c2 0 20%, transparent 48%),
                linear-gradient(160deg, #efe0c8, #e4c9a8 55%, #d7b48c);
        }
        header, main { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
        header { padding: 2.2rem 0 1.2rem; }
        h1, h2 { font-family: Fraunces, Georgia, serif; margin: 0; }
        h1 { font-size: clamp(2rem, 4vw, 3.2rem); letter-spacing: -0.03em; }
        .lede { max-width: 42rem; color: var(--cocoa); margin: 0.6rem 0 0; }
        .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 1.2rem; padding-bottom: 3rem; }
        @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 1.25rem;
            padding: 1.15rem 1.2rem 1.3rem;
            box-shadow: 0 18px 40px rgba(80, 40, 20, 0.08);
            backdrop-filter: blur(8px);
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { text-align: left; padding: 0.55rem 0.35rem; border-bottom: 1px solid var(--line); }
        th { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cocoa); }
        .low { color: var(--berry); font-weight: 600; }
        .ok { color: var(--sage); }
        .recipe-lines { list-style: none; padding: 0; margin: 0.8rem 0 1.1rem; }
        .recipe-lines li { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px dashed var(--line); }
        label { display: block; font-size: 0.8rem; margin-bottom: 0.35rem; color: var(--cocoa); }
        input {
            width: 5.5rem;
            padding: 0.45rem 0.55rem;
            border-radius: 0.6rem;
            border: 1px solid var(--line);
            font: inherit;
        }
        .row { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
        button {
            font: inherit;
            font-weight: 600;
            border: 0;
            border-radius: 999px;
            padding: 0.7rem 1.15rem;
            background: var(--ink);
            color: #f8efe4;
            cursor: pointer;
        }
        button:hover { background: var(--cocoa); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .banner { min-height: 1.4rem; margin-top: 0.9rem; font-weight: 500; }
        .banner.error { color: var(--berry); }
        .banner.success { color: var(--sage); }
        .chip { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; background: #f0d9b8; font-size: 0.75rem; }
        a.docs { color: var(--cocoa); }
    </style>
</head>
<body>
<header>
    <p class="chip">Pastry bench MVP</p>
    <h1>What can we bake today?</h1>
    <p class="lede">Live stock on the left. The seeded vanilla sponge on the right. Produce a batch and watch quantities fall — or see exactly what is short.</p>
    <p><a class="docs" href="/swagger-ui.html">Open Swagger</a> · <a class="docs" href="/actuator/health">Health</a></p>
</header>
<main class="grid">
    <section class="card">
        <h2>Stock</h2>
        <table>
            <thead>
            <tr><th>Ingredient</th><th>On hand</th><th>Min</th><th>Status</th></tr>
            </thead>
            <tbody id="stock-body"><tr><td colspan="4">Loading…</td></tr></tbody>
        </table>
    </section>
    <section class="card">
        <h2 id="recipe-title">Recipe</h2>
        <p id="recipe-desc"></p>
        <ul class="recipe-lines" id="recipe-lines"></ul>
        <div class="row">
            <div>
                <label for="batches">Batches</label>
                <input id="batches" type="number" min="1" value="1">
            </div>
            <button id="produce" type="button">Produce batch</button>
        </div>
        <p class="banner" id="banner" role="status"></p>
    </section>
</main>
<script>
    const stockBody = document.getElementById("stock-body");
    const banner = document.getElementById("banner");
    let recipeId = null;

    async function loadStock() {
        const res = await fetch("/api/ingredients?size=100");
        const data = await res.json();
        stockBody.innerHTML = (data.content || []).map((item) => {
            const cls = item.lowStock ? "low" : "ok";
            const qty = `${item.quantity} ${item.unit}`;
            return `<tr>
                <td>${item.name}<br><small>${item.brand || ""}</small></td>
                <td class="${cls}">${qty}</td>
                <td>${item.minimumQuantity} ${item.unit}</td>
                <td>${item.lowStock ? "Low stock" : "Ready"}</td>
            </tr>`;
        }).join("");
    }

    async function loadRecipe() {
        const res = await fetch("/api/recipes");
        const data = await res.json();
        const recipe = (data.content || [])[0];
        if (!recipe) {
            document.getElementById("recipe-title").textContent = "No recipe yet";
            return;
        }
        recipeId = recipe.guid;
        document.getElementById("recipe-title").textContent = recipe.name;
        document.getElementById("recipe-desc").textContent = `${recipe.description || ""} · ${recipe.servings} servings`;
        document.getElementById("recipe-lines").innerHTML = recipe.lines.map((line) =>
            `<li><span>${line.ingredientName}</span><span>${line.quantity} ${line.unit}</span></li>`
        ).join("");
    }

    document.getElementById("produce").addEventListener("click", async () => {
        banner.className = "banner";
        banner.textContent = "";
        if (!recipeId) return;
        const batches = Number(document.getElementById("batches").value || 1);
        const res = await fetch(`/api/recipes/${recipeId}/produce`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ batches })
        });
        const body = await res.json();
        if (res.ok) {
            banner.classList.add("success");
            banner.textContent = `Baked ${body.batches} batch(es) of ${body.recipeName}.`;
            await loadStock();
            return;
        }
        banner.classList.add("error");
        const shortage = (body.shortages || [])
            .map((s) => `${s.ingredientName}: need ${s.required} ${s.unit}, have ${s.available}`)
            .join(" · ");
        banner.textContent = shortage || body.message || "Could not produce.";
    });

    loadStock();
    loadRecipe();
</script>
</body>
</html>
